<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 380px;
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      background: #f8fafc;
      color: #1a2233;
    }
    .content { padding: 12px 16px; }
    .btn-row { display: flex; gap: 8px; margin-bottom: 8px; }
    button {
      flex: 1; background: #2563eb; color: #fff; border: none;
      border-radius: 8px; padding: 10px 8px;
      font-size: 13px; font-weight: 500; cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #d3d8e2; color: #8a92a0; cursor: not-allowed; }
    .btn-reset { background: #fee2e2; color: #b91c1c; }
    .btn-reset:hover { background: #fecaca; }
    .btn-capture { background: #16a34a; }
    .btn-capture.running { background: #dc2626; }
    .sheet-box {
      background: #fff; border-radius: 8px; padding: 10px; margin-bottom: 10px;
      border: 1px solid #e7eaf1;
    }
    .sheet-box .row1 { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .sheet-box label { font-size: 12px; font-weight: 600; color: #1a2233; }
    .sheet-box input[type="text"] {
      width: 100%; padding: 8px; border: 1px solid #cbd5e1;
      border-radius: 6px; font-size: 11px; margin-bottom: 6px;
      font-family: monospace;
    }
    .sheet-box .btn-row-mini { display: flex; gap: 6px; }
    .sheet-box .btn-row-mini button {
      flex: 1; padding: 6px; font-size: 11px; border-radius: 6px;
    }
    .sheet-box .btn-save { background: #64748b; }
    .sheet-box .btn-save:hover { background: #475569; }
    .sheet-status { font-size: 10px; color: #5b6472; margin-top: 4px; min-height: 12px; }
    .sheet-status.ok { color: #0e6b46; }
    .sheet-status.err { color: #9c372e; }
  </style>
</head>
<body>
  <div class="content">
    <div class="btn-row">
      <button id="captureToggle" class="btn-capture">Start</button>
      <button id="resetDataBtn" class="btn-reset">↻ Reset data</button>
    </div>

    <div class="sheet-box">
      <div class="row1">
        <label>📊 Google Sheet sync</label>
      </div>
      <input type="text" id="sheetUrlInput" placeholder="Paste Apps Script Web App /exec URL..." />
      <div class="btn-row-mini">
        <button id="saveSheetUrl" class="btn-save">💾 Save URL</button>
      </div>
      <div class="sheet-status" id="sheetStatus"></div>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
